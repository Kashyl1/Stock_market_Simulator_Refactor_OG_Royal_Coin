spring:
  application:
    name: trading-simulator-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trading_simulator}
    username: ${DB_USERNAME:trading_simulator}
    password: ${DB_PASSWORD:trading_simulator}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

process-engine:
  max-transitions-per-run: 100

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  auth:
    access-token-ttl: 60m
    refresh-token-ttl: 14d
    rsa-private-key: ${APP_AUTH_RSA_PRIVATE_KEY:file:keys/jwt-private.pem}
    rsa-public-key: ${APP_AUTH_RSA_PUBLIC_KEY:file:keys/jwt-public.pem}
    verification-token-ttl: 24h
    reset-token-ttl: 1h
    frontend-base-url: ${APP_AUTH_FRONTEND_BASE_URL:http://localhost:4200}
