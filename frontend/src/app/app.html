<a class="skip-link" href="#content">Skip to content</a>

<header class="top-bar">
  <div class="top-bar__inner">
    <a class="brand" [routerLink]="paths.Home">{{ appName }}</a>

    <nav class="top-bar__nav" aria-label="Main">
      <a class="button button--small" [routerLink]="paths.Login" routerLinkActive="is-active"
        >Log in</a
      >
      <a
        class="button button--small button--primary"
        [routerLink]="paths.Register"
        routerLinkActive="is-active"
        >Create account</a
      >
    </nav>
  </div>
</header>

<main id="content" class="content">
  <router-outlet />
</main>

<footer class="footer">
  <div class="footer__inner">
    <span>{{ appName }} &middot; {{ currentYear }}</span>
    <span class="muted">{{ disclaimer }}</span>
  </div>
</footer>
