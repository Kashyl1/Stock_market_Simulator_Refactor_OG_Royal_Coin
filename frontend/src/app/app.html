<a class="skip-link" href="#content">Skip to content</a>

<header class="top-bar">
  <div class="top-bar__inner">
    <a class="brand" [routerLink]="brandLink()">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M4 16l5-5 4 4 7-7" />
          <path d="M15 8h5v5" />
        </svg>
      </span>
      {{ appName }}
    </a>

    <nav class="top-bar__nav" aria-label="Main">
      @if (currentUser(); as user) {
        @if (isAdmin()) {
          <a
            class="button button--ghost button--small"
            [routerLink]="paths.AdminBatch"
            routerLinkActive="is-active"
            >Admin panel</a
          >
        }
        <app-theme-toggle />
        <a
          class="button button--ghost button--small user"
          [routerLink]="paths.Dashboard"
          routerLinkActive="is-active"
        >
          <span class="avatar" aria-hidden="true">{{ initials() }}</span>
          <span class="user__name">{{ user.displayName }}</span>
        </a>
        <button class="button button--ghost button--small" type="button" (click)="signOut()">
          Log out
        </button>
      } @else {
        <app-theme-toggle />
        <a
          class="button button--ghost button--small"
          [routerLink]="paths.Login"
          routerLinkActive="is-active"
          >Log in</a
        >
        <a class="button button--small" [routerLink]="paths.Register">Create account</a>
      }
    </nav>
  </div>
</header>

<main id="content" class="content">
  <router-outlet />
</main>

<footer class="footer">
  <div class="footer__inner">
    <span>{{ appName }} &middot; {{ currentYear }}</span>
    <span>{{ disclaimer }}</span>
  </div>
</footer>
