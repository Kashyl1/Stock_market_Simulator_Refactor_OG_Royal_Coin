<section class="card dashboard">
  @if (account(); as user) {
    <p class="dashboard__eyebrow">Signed in as</p>
    <h1>{{ user.displayName }}</h1>

    <dl>
      <div>
        <dt>e-mail</dt>
        <dd>{{ user.email }}</dd>
      </div>
      <div>
        <dt>role</dt>
        <dd>{{ user.role }}</dd>
      </div>
      <div>
        <dt>status</dt>
        <dd>{{ user.status }}</dd>
      </div>
    </dl>
  }

  @if (isAdmin()) {
    <div class="dashboard__admin">
      <p>You can see and run the scheduled jobs of the engine.</p>
      <a class="button button--small" [routerLink]="paths.AdminBatch">Open the batch jobs</a>
    </div>
  }

  <p class="muted">Your wallet, portfolios and trading arrive with the next stages.</p>
</section>
