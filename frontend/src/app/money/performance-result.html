@if (performance().result !== null) {
  <span class="result" [class]="toneClass()">
    <span class="result__amount">{{
      performance().result | money: performance().currency : true
    }}</span>
    @if (percent(); as shown) {
      <span class="result__percent">({{ shown }})</span>
    }
  </span>
} @else {
  <span class="muted">Not valued yet</span>
}
